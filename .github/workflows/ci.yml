name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (deploy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Test
        run: |
          mkdir -p tests/logs
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  evidence-pack:
    name: Export evidence pack artifact
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Export JSON evidence pack
        env:
          JIRA_WEBHOOK_SECRET: ci-export-webhook-secret
          JIRA_APPROVER_DOMAIN: example.com
        run: |
          python scripts/export_evidence_pack.py \
            --intake tests/golden/personal_no_dpa.intake.json \
            --out-dir artifacts
          (cd artifacts && sha256sum -c evidence-pack.sha256)
      - name: Upload evidence pack
        uses: actions/upload-artifact@v4
        with:
          name: evidence-pack
          path: |
            artifacts/evidence-pack.json
            artifacts/evidence-pack.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Production deploy gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, evidence-pack]
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Download evidence pack
        uses: actions/download-artifact@v4
        with:
          name: evidence-pack
          path: artifacts
      - name: Verify pack integrity
        run: |
          (cd artifacts && sha256sum -c evidence-pack.sha256)
          python - <<'PY'
          import json

          with open("artifacts/evidence-pack.json", encoding="utf-8") as handle:
              pack = json.load(handle)
          assert pack.get("engine_version") == "deterministic-rules-v1"
          assert pack.get("evidence_pack", {}).get("risk_decision")
          print("evidence pack gate ok", pack["decision"], pack["assessment_id"])
          PY
      - name: Build container (deployability gate)
        run: docker build -t enterprise-ai-risk:${{ github.sha }} .
      - name: Record deploy decision
        run: |
          echo "Tests passed, evidence pack SHA-256 verified, image builds."
          echo "Push the image to your registry and set required reviewers on the"
          echo "GitHub Environment named production (Settings → Environments)."
