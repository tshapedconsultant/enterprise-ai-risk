# Demo / PoC. SQLite survives container restart through the named volume.
# Keep one replica: SQLite is not the multi-tenant/horizontal production store.
services:
  risk-console:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_USER_EMAIL: ${JIRA_USER_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_WEBHOOK_SECRET: ${JIRA_WEBHOOK_SECRET:?JIRA_WEBHOOK_SECRET is required}
      JIRA_APPROVER_DOMAIN: ${JIRA_APPROVER_DOMAIN:?JIRA_APPROVER_DOMAIN is required}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-AIGOV}
      REQUIRE_ASSESSMENT_AUTH: ${REQUIRE_ASSESSMENT_AUTH:-true}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-}
      DATA_STORE: /data/app.sqlite
      COMPLIANCE_FRAMEWORKS: ${COMPLIANCE_FRAMEWORKS:-gdpr,eu_ai_act,iso_42001,nist_ai_rmf}
    volumes:
      - app-data:/data

volumes:
  app-data:
